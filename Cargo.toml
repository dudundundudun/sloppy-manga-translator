[workspace]
resolver = "2"
members = [
    "crates/miko-core",
    "crates/miko-cleaner",
    "crates/miko-ocr",
    "crates/miko-ort",
    "crates/miko-translator",
    "crates/miko-renderer",
    "crates/miko-server",
]

[workspace.package]
version = "7.0.0-alpha.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ab_glyph = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
flate2 = "1"
thiserror = "2"
